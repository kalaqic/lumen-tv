name: Napravi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/release/app-release.apk LumenTV.apk

      - name: Sačuvaj APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LumenTV
          path: LumenTV.apk

      - name: Objavi kao Release (link za Downloader)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumen TV (build ${{ github.run_number }})
          body: |
            Za instalaciju na TV, u aplikaciju **Downloader** ukucaj:
            https://github.com/${{ github.repository }}/releases/latest/download/LumenTV.apk
          files: LumenTV.apk
          make_latest: true
