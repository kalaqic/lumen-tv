plugins {
    id 'com.android.application'
}

// Na GitHubu se broj builda automatski povecava (1, 2, 3…); lokalno je 1
def buildNum = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').trim().toInteger()

android {
    namespace 'ba.lumen.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'ba.lumen.tv'
        minSdk 21
        targetSdk 34
        versionCode buildNum
        versionName "1.0.$buildNum"
    }

    signingConfigs {
        // Fiksni kljuc da bi se nove verzije mogle instalirati preko stare
        lumen {
            storeFile file('lumen.keystore')
            storePassword 'lumentv123'
            keyAlias 'lumen'
            keyPassword 'lumentv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lumen
        }
        debug {
            signingConfig signingConfigs.lumen
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // QR kod za povezivanje TV-a sa sajtom (3.3.0 radi i na starijim Android TV-ima, API 21+)
    implementation 'com.google.zxing:core:3.3.0'
}
